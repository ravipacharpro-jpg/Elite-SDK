// EXAMPLE: host app's app/build.gradle (do not paste a second android block).
android {
    defaultConfig { minSdk 24 }
}
dependencies {
    implementation files('libs/Bcore-debug.aar')
    // Black Reflection is already compiled inside the AAR. NO extra JAR.
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.moandjiezana.toml:toml4j:0.7.2'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
}
// You MUST initialize BlackBoxCore in your Application class:
// BlackBoxCore.get().doAttachBaseContext(...) in attachBaseContext()
// BlackBoxCore.get().doCreate() in onCreate()
// See original ELITE app/src/main/java/com/pubgm/BoxApplication.java.
