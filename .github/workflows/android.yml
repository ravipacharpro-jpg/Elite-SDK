name: Build Elite SDK AAR

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Elite SDK Release AAR
        run: ./gradlew :Bcore:assembleRelease --no-daemon --stacktrace

      - name: Upload Release AAR
        uses: actions/upload-artifact@v4
        with:
          name: Elite-Bcore-release-aar
          path: Bcore/build/outputs/aar/*.aar

      - name: Create Release
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Elite SDK v1.0.0
          body: |
            ### Elite SDK (AAR Build with 1-Tap Google Account Picker)
            - Integrated 1-Tap Native Google Account Picker dialog
            - Added Web Sign-In fallback
            - End-to-end OAuth & Google token synthesis
          files: Bcore/build/outputs/aar/*.aar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
